name: Pruebas Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "tests/test_dgt_api.py"
      - "tests/test_dgt_postgres_migration.py"
      - "tests/test_mail_api.py"
      - "tests/test_messaging*.py"
      - "tests/test_client*.py"
      - "tests/test_feature_flags.py"
      - "tests/test_worker_endpoints.py"
      - "tests/test_notification_concurrency_pg.py"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_dgt_api.py"
      - "tests/test_dgt_postgres_migration.py"
      - "tests/test_mail_api.py"
      - "tests/test_messaging*.py"
      - "tests/test_client*.py"
      - "tests/test_feature_flags.py"
      - "tests/test_worker_endpoints.py"
      - "tests/test_notification_concurrency_pg.py"
      - ".github/workflows/backend-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestinem_test
          POSTGRES_PASSWORD: gestinem_test
          POSTGRES_DB: gestinem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestinem_test -d gestinem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      BACKEND_DATABASE_URL: postgresql+psycopg://gestinem_test:gestinem_test@localhost:5432/gestinem_test
      TEST_POSTGRES_URL: postgresql+psycopg://gestinem_test:gestinem_test@localhost:5432/gestinem_test
      # Los modulos de prueba cambian esta clave segun el escenario. Se usa
      # temporalmente el alias compatible para que puedan aislarla sin que la
      # variable canonica BACKEND_INTERNAL_API_KEY tenga prioridad global.
      DGT_INTERNAL_API_KEY: test-pg-concurrent
      MESSAGING_GRAPH_FROM: noreply@test.es
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest
      - name: Ejecutar pruebas backend
        run: >-
          pytest
          tests/test_dgt_api.py
          tests/test_dgt_postgres_migration.py
          tests/test_mail_api.py
          tests/test_messaging_api.py
          tests/test_messaging_firebase.py
          tests/test_messaging_mail.py
          tests/test_messaging_flutter_api.py
          tests/test_client_validation.py
          tests/test_client_profile_api.py
          tests/test_client_documents_api.py
          tests/test_client_invoices_api.py
          tests/test_feature_flags.py
          tests/test_worker_endpoints.py
          tests/test_notification_concurrency_pg.py
          --junitxml=backend-test-results.xml
          --tb=short
          -ra
          -q
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend-test-results.xml
          if-no-files-found: warn
      - name: Publicar fallos como anotaciones
        if: failure()
        shell: pwsh
        run: |
          [xml]$results = Get-Content "backend-test-results.xml" -Raw
          $failures = @($results.testsuites.testsuite.testcase | Where-Object { $_.failure -or $_.error })
          foreach ($case in $failures) {
            $failure = if ($case.failure) { $case.failure } else { $case.error }
            $message = "$($case.classname).$($case.name): $($failure.message)`n$($failure.'#text')"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Pytest::$message"
          }
