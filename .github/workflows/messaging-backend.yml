name: Messaging Backend

on:
  push:
    paths:
      - "backend/api/messaging*.py"
      - "backend/migrations/**"
      - "tests/test_messaging*.py"
      - ".github/workflows/messaging-backend.yml"
  pull_request:
    paths:
      - "backend/api/messaging*.py"
      - "backend/migrations/**"
      - "tests/test_messaging*.py"
      - ".github/workflows/messaging-backend.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DGT_DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest tests/test_messaging_api.py tests/test_messaging_push.py tests/test_messaging_mail.py tests/test_messaging_flutter_api.py -q
