[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# El servicio de Railway solo debe reconstruirse cuando cambia su API, no al
# publicar una nueva version de la aplicacion de escritorio. La version Flutter
# si forma parte del contrato publico del backend y debe disparar el despliegue.
watchPatterns = ["backend/**", "utils/estados_dehu.py", "utils/__init__.py", "docs/Manual_Mensajeria_Gestinem.pdf", "gestinem_app/pubspec.yaml", "railway.toml"]

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
preDeployCommand = "python -m backend.migrate"
# Etapa B activa: las migraciones pendientes se aplican antes de arrancar la
# nueva version y Railway solo la publica cuando /health/ready confirma la BD.
