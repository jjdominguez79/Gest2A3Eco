[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# El servicio de Railway solo debe reconstruirse cuando cambia su API, no al
# publicar una nueva version de la aplicacion de escritorio. La version Flutter
# si forma parte del contrato publico del backend y debe disparar el despliegue.
watchPatterns = ["backend/**", "utils/estados_dehu.py", "utils/__init__.py", "docs/Manual_Mensajeria_Gestinem.pdf", "gestinem_app/pubspec.yaml", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# preDeployCommand se activa en Etapa B (ver DEPLOY_PLAN.md).
# Etapa A (actual): sin preDeployCommand; sin DDL en startup ni pre-deploy.
# Etapa B: anadir preDeployCommand = "python -m backend.migrate"
#          y cambiar healthcheckPath = "/health/ready".
