services:
  mail-sync:
    build:
      context: ../..
      dockerfile: deploy/mail-sync/Dockerfile
    container_name: gest2a3eco-mail-sync
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      GRAPH_TENANT_ID: "99d74b8f-e9cc-4cae-903f-d123bc7abc8a"
      GRAPH_CLIENT_ID: "cfa49b8f-5009-4618-a4a5-1c5e03cef13a"
      GRAPH_MAILBOX: "oficina@gestinem.es"
      GRAPH_CERTIFICATE_FILE: "/run/secrets/graph_certificate"
      GRAPH_CERTIFICATE_PASSWORD_FILE: "/run/secrets/graph_certificate_password"
      POSTGRES_HOST: "192.168.0.19"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "gest2a3eco"
      POSTGRES_USER: "gest2a3eco_sync"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
      SYNC_INTERVAL_SECONDS: "300"
      IMPORT_EXISTING_ON_FIRST_RUN: "false"
    secrets:
      - graph_certificate
      - graph_certificate_password
      - postgres_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  messaging-sync:
    build:
      context: ../..
      dockerfile: deploy/mail-sync/Dockerfile
    container_name: gest2a3eco-messaging-sync
    command: ["python", "-m", "sync_worker.messaging_worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      MESSAGING_API_URL: "https://gest2a3eco-production.up.railway.app"
      MESSAGING_SYNC_TOKEN_FILE: "/run/secrets/messaging_sync_token"
      MESSAGING_WORKER_ID: "synology"
      MESSAGING_SYNC_INTERVAL_SECONDS: "60"
      DOCUMENT_REPOSITORY_DIR: "/data/gest2a3eco"
      DOCUMENT_REPOSITORY_PUBLIC_DIR: '\\GestinemMain\Doc_Compartidos\Gest2A3Eco'
      POSTGRES_HOST: "192.168.0.19"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "gest2a3eco"
      POSTGRES_USER: "gest2a3eco_sync"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
    volumes:
      - "${DOCUMENT_REPOSITORY_HOST_PATH:-/volume1/Doc_Compartidos/Gest2A3Eco}:/data/gest2a3eco:rw"
    secrets:
      - messaging_sync_token
      - postgres_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  master-data-sync:
    build:
      context: ../..
      dockerfile: deploy/mail-sync/Dockerfile
    container_name: gest2a3eco-master-data-sync
    command: ["python", "-m", "sync_worker.master_data_worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      CLIENT_MASTER_SYNC_API_URL: "https://gest2a3eco-production.up.railway.app"
      CLIENT_MASTER_SYNC_TOKEN_FILE: "/run/secrets/client_master_sync_token"
      CLIENT_MASTER_SYNC_INTERVAL_SECONDS: "300"
      CLIENT_ONLINE_SERIES_CODE: "APP"
      POSTGRES_HOST: "192.168.0.19"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "gest2a3eco"
      POSTGRES_USER: "gest2a3eco_sync"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
    secrets:
      - client_master_sync_token
      - postgres_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  graph_certificate:
    file: ./secrets/Gest2A3Eco-Sync.pfx
  graph_certificate_password:
    file: ./secrets/pfx_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  messaging_sync_token:
    file: ./secrets/messaging_sync_token.txt
  client_master_sync_token:
    file: ./secrets/client_master_sync_token.txt

