services:
  aapp-certificates-worker:
    build:
      context: ../..
      dockerfile: deploy/aapp-worker/Dockerfile
    image: gest2a3eco-aapp-worker:2026.10.22.1
    container_name: gest2a3eco-aapp-certificates-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    shm_size: "512m"
    environment:
      AAPP_BACKEND_URL: "https://gest2a3eco-production.up.railway.app"
      AAPP_WORKER_API_KEY_FILE: "/run/secrets/aapp_certificates_worker_api_key"
      AAPP_WORKER_ROLE: "certificates"
      AAPP_INTERVAL_SECONDS: "30"
      AAPP_REQUEST_TIMEOUT_SECONDS: "120"
      AAPP_HEADLESS: "true"
      AAPP_DIAGNOSTIC_DIR: "/data/diagnostico"
    volumes:
      - "/volume1/docker/gest2a3eco-aapp/certificates-diagnostico:/data/diagnostico:rw"
    secrets:
      - aapp_certificates_worker_api_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  aapp-notifications-worker:
    image: gest2a3eco-aapp-worker:2026.10.22.1
    container_name: gest2a3eco-aapp-notifications-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    shm_size: "512m"
    environment:
      AAPP_BACKEND_URL: "https://gest2a3eco-production.up.railway.app"
      AAPP_WORKER_API_KEY_FILE: "/run/secrets/aapp_notifications_worker_api_key"
      AAPP_WORKER_ROLE: "notifications"
      AAPP_INTERVAL_SECONDS: "30"
      AAPP_REQUEST_TIMEOUT_SECONDS: "120"
      AAPP_HEADLESS: "true"
      AAPP_DIAGNOSTIC_DIR: "/data/diagnostico"
    volumes:
      - "/volume1/docker/gest2a3eco-aapp/notifications-diagnostico:/data/diagnostico:rw"
    secrets:
      - aapp_notifications_worker_api_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  aapp_certificates_worker_api_key:
    file: ./secrets/aapp_certificates_worker_api_key.txt
  aapp_notifications_worker_api_key:
    file: ./secrets/aapp_notifications_worker_api_key.txt
