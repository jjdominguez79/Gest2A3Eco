services:
  aapp-worker:
    image: gest2a3eco-aapp-worker:2026.09.11.11
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gest2a3eco-aapp-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    shm_size: "512m"
    environment:
      AAPP_BACKEND_URL: "https://gest2a3eco-production.up.railway.app"
      AAPP_WORKER_API_KEY_FILE: "/run/secrets/aapp_worker_api_key"
      AAPP_INTERVAL_SECONDS: "30"
      AAPP_REQUEST_TIMEOUT_SECONDS: "120"
      AAPP_HEADLESS: "true"
      AAPP_DIAGNOSTIC_DIR: "/data/diagnostico"
    volumes:
      - "/volume1/docker/gest2a3eco-aapp-worker/diagnostico:/data/diagnostico:rw"
    secrets:
      - aapp_worker_api_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  aapp_worker_api_key:
    file: ./secrets/aapp_worker_api_key.txt
